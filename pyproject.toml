[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preframr-experiments"
version = "0.1.0"
description = "Docker-driven experiment runner + spec registry for the preframr SID model research stack."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Josh Bailey" }]
dependencies = []

# Test tooling (pytest/pylint/black come from the anarkiwi/preframr base image
# in Docker). Declared here for local runs: `pip install -e .[dev]`. The Docker
# build installs pytest-xdist explicitly because the pinned base predates it.
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.5",
]

[project.scripts]
preframr-experiments-run = "preframr_experiments.run:main"
preframr-experiments-hvsc-check = "preframr_experiments.hvsc_version_check:main"

[tool.setuptools.packages.find]
include = ["preframr_experiments*"]

[tool.setuptools.package-data]
"preframr_experiments" = [
    "data/*.list",
    "data/*.md",
    "data/*/*.list",
    "data/*/HVSC_VERSION",
    "data/refuted/*.md",
    "preflight/*.py",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
